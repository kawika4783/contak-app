services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contak
      POSTGRES_USER: contak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - contak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contak -d contak"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - contak_redis:/data

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --realm=contak-app.srv1831469.hstgr.cloud
      - --server-name=contak-app.srv1831469.hstgr.cloud
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:?Set TURN_USERNAME in .env}:${TURN_PASSWORD:?Set TURN_PASSWORD in .env}
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://contak:${POSTGRES_PASSWORD}@postgres:5432/contak
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@contak.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      TURN_HOST: ${TURN_HOST:-contak-app.srv1831469.hstgr.cloud}
      TURN_USERNAME: ${TURN_USERNAME:?Set TURN_USERNAME in .env}
      TURN_PASSWORD: ${TURN_PASSWORD:?Set TURN_PASSWORD in .env}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    labels:
      traefik.enable: "true"
      traefik.http.routers.contak-app.rule: "Host(`contak-app.srv1831469.hstgr.cloud`)"
      traefik.http.routers.contak-app.entrypoints: "websecure"
      traefik.http.routers.contak-app.tls: "true"
      traefik.http.routers.contak-app.tls.certresolver: "letsencrypt"
      traefik.http.services.contak-app.loadbalancer.server.port: "80"

volumes:
  contak_postgres:
  contak_redis:
